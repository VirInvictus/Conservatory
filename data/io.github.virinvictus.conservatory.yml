# Flatpak manifest for Conservatory.
#
# Build:
#   flatpak-builder --user --install --force-clean build-dir \
#     data/io.github.virinvictus.conservatory.yml
#
# The build is offline-shaped: data/cargo-sources.json vendors every crate in
# Cargo.lock (git deps pinned at their lock commits). Regenerate it whenever
# Cargo.lock changes:
#   uv run scripts/flatpak-cargo-generator.py Cargo.lock -o data/cargo-sources.json
#
# Run:
#   flatpak run io.github.virinvictus.conservatory
#
# Targets the GNOME 50 runtime, matching every other manifest in the portfolio
# (Atrium, Hermitage, Viaduct, Framework, Colophon). Version consolidation is
# deliberate: a manifest left on an older branch pins a second multi-GB SDK that
# `flatpak uninstall --unused` will not reclaim while the manifest asks for it.
#
# STATUS: not yet Flathub-submittable, and the gaps are known rather than
# forgotten. See the notes at the bottom.
---
app-id: io.github.virinvictus.conservatory
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # bindgen (the pipewire Rust stack behind the Phase 12d spectrum tap) needs
  # libclang at build time; the Sdk does not ship it. Installed from the
  # freedesktop 25.08 branch (the GNOME 50 base).
  - org.freedesktop.Sdk.Extension.llvm21
command: conservatory

# Skip flatpak-builder's appstreamcli-compose pass: librsvg's pixbuf loader is
# not reliably present on modern Fedora hosts, and GTK4 renders SVG natively
# without it. Flathub re-runs compose with its own toolchain at submission, so
# this only affects local builds. The metainfo is validated separately by the
# meson test, so skipping compose does not skip checking it.
appstream-compose: false

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm21/bin
  env:
    CARGO_HOME: /run/build/conservatory/cargo
    CARGO_NET_OFFLINE: 'true'
    LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib

# Sandbox permissions.
#
# Wider than Atrium's on purpose, and each widening has a reason:
#
#   --filesystem=home        Conservatory OWNS AND MOVES files. The library root
#                            defaults to ~/Conservatory but the user may point it
#                            anywhere, and imports are dragged in from anywhere.
#   --socket=pulseaudio      it is an audio player.
#   --share=network          podcast feeds and episode downloads, and the opt-in
#                            ListenBrainz / Last.fm scrobblers. Music playback
#                            itself never needs it.
#   --talk-name=...secrets   scrobbler tokens go to the secret service via oo7,
#                            not to a plaintext config file.
#   --own-name=...MediaPlayer2.conservatory  MPRIS2, so media keys and desktop
#                            widgets can see and control playback.
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
  - --own-name=org.mpris.MediaPlayer2.conservatory

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.la'
  - '*.a'

modules:

  # The playback host and the four shelled-out tools, as own manifest modules
  # (the §5.8 decision, 2026-09-06: own modules, not a shared extension; the
  # ffmpeg-full extension was struck on research). One minimal ffmpeg module
  # yields both ffmpeg and ffprobe plus the libs libmpv and rsgain link.
  # Module order is the dependency order; everything installs into /app.

  - name: ffmpeg
    buildsystem: simple
    build-commands:
      # Minimal-but-sufficient ffmpeg: no external libraries beyond gnutls
      # (https for undownloaded-episode streaming through libmpv), docs and
      # autodetect off. The builtin decoders, demuxers, and af filters the
      # app needs (volume, equalizer, acompressor, alimiter, dynaudnorm,
      # silenceremove, loudnorm) are all compiled in by default; autodetect
      # off only keeps external-library components out. ffplay is skipped
      # (no SDL with autodetect off); ffmpeg and ffprobe install.
      - ./configure --prefix=/app
          --disable-doc --disable-debug --disable-autodetect
          --disable-static --enable-shared
          --enable-gpl --enable-network --enable-gnutls
          --disable-ffplay
      - make -j${FLATPAK_BUILDER_N_JOBS:-$(nproc)}
      - make install
    sources:
      - type: archive
        url: https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n7.1.1.tar.gz
        sha256: f117507dc501f2a6c11f9241d8d0c3213846cfad91764361af37befd6b6c523d
    cleanup:
      # The ffmpeg + ffprobe CLI tools STAY (the §5.8 bundling is exactly
      # about the sandboxed $PATH); only the docs go.
      - /share/ffmpeg

  # mpv 0.40 hard-requires libplacebo (>= 6.338.2) and libass (>= 0.12.2),
  # and neither ships in org.gnome.Sdk; they precede libmpv. The Sdk carries
  # shaderc (SPIR-V) and the vulkan / EGL stacks, so glslang is off and the
  # rest auto-detects. The app is audio-only, but vo_gpu is mpv's only
  # modern video path, so the library build needs the full renderer.
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=false
      - -Dtests=false
      - -Dglslang=disabled
      # The opengl module needs its glad loader (a git submodule the release
      # tarball does not carry); vulkan is the support mpv hard-requires and
      # the Sdk's vulkan headers + shaderc cover it.
      - -Dopengl=disabled
    sources:
      - type: archive
        url: https://github.com/haasn/libplacebo/archive/refs/tags/v7.360.1.tar.gz
        sha256: d05fdf90bea2f629eaa2d115e909fd356388ac639e54f77b87a018a6d76224bd

  - name: libass
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/libass/libass/archive/refs/tags/0.17.4.tar.gz
        sha256: c287d180d93dc9c9021872574b618ac49027e84cc90e1289318b1ee68bb42251

  - name: libmpv
    buildsystem: meson
    config-opts:
      # Library build only: no CLI player, no scripting, no docs. Audio
      # output auto-detects what the Sdk carries (pulse / pipewire); video
      # outputs fall back to whatever is present (the app is audio-only).
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dbuild-date=false
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.40.0.tar.gz
        sha256: 10a0f4654f62140a6dd4d380dcf0bbdbdcf6e697556863dc499c296182f081a3

  - name: flac
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_PROGRAMS=ON
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_DOCS=OFF
      - -DBUILD_TESTING=OFF
      - -DWITH_OGG=OFF
      - -DINSTALL_MANPAGES=OFF
      - -DCMAKE_INSTALL_LIBDIR=lib
    sources:
      - type: archive
        url: https://github.com/xiph/flac/archive/refs/tags/1.5.0.tar.gz
        sha256: aea54ed186ad07a34750399cb27fc216a2b62d0ffcd6dc2e3064a3518c3146f8

  - name: rsgain-deps
    buildsystem: simple
    build-commands: []
    modules:

      - name: libebur128
        buildsystem: cmake-ninja
        builddir: true
        config-opts:
          - -DCMAKE_BUILD_TYPE=Release
          - -DCMAKE_INSTALL_LIBDIR=lib
          # The 1.2.6 release predates the Sdk's CMake floor; its
          # cmake_minimum_required predates 3.5.
          - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        sources:
          - type: archive
            url: https://github.com/jiixyj/libebur128/archive/refs/tags/v1.2.6.tar.gz
            sha256: baa7fc293a3d4651e244d8022ad03ab797ca3c2ad8442c43199afe8059faa613

      - name: utfcpp
        # Header-only; taglib 2.x requires it (upstream vendors it as a git
        # submodule, which a release tarball does not carry).
        buildsystem: cmake-ninja
        builddir: true
        config-opts:
          - -DCMAKE_BUILD_TYPE=Release
          - -DBUILD_TESTS=OFF
        sources:
          - type: archive
            url: https://github.com/nemtrif/utfcpp/archive/refs/tags/v4.2.0.tar.gz
            sha256: 54a8e96ea835a7359e8e53d03e30e9833d51350cc4615ff53f8449ef19ee46ab

      - name: taglib
        buildsystem: cmake-ninja
        builddir: true
        config-opts:
          - -DCMAKE_BUILD_TYPE=Release
          - -DBUILD_SHARED_LIBS=ON
          - -DBUILD_TESTING=OFF
          - -DCMAKE_INSTALL_LIBDIR=lib
        sources:
          - type: archive
            url: https://github.com/taglib/taglib/archive/refs/tags/v2.0.2.tar.gz
            sha256: 0de288d7fe34ba133199fd8512f19cc1100196826eafcb67a33b224ec3a59737

      - name: inih
        buildsystem: meson
        sources:
          - type: archive
            url: https://github.com/benhoyt/inih/archive/refs/tags/r58.tar.gz
            sha256: e79216260d5dffe809bda840be48ab0eec7737b2bb9f02d2275c1b46344ea7b7

  - name: rsgain
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/complexlogic/rsgain/archive/refs/tags/v3.6.tar.gz
        sha256: 26f7acd1ba0851929dc756c93b3b1a6d66d7f2f36b31f744c8181f14d7b5c8a7

  - name: conservatory
    buildsystem: meson
    build-options:
      env:
        # libmpv2-sys emits a bare `-lmpv` (no pkg-config), so the build-time
        # linker needs the module-scoped lib dir on its search path.
        LIBRARY_PATH: /app/lib
    sources:
      # Local builds use the working tree. For a Flathub submission PR,
      # replace the dir source with the tagged release (the Atrium form:
      # type git + url + tag + commit). Don't copy build artifacts into
      # the sandbox; a warm target/ is multiple GB and the offline build
      # must not see it anyway.
      - type: dir
        path: ../
        skip:
          - .git
          - target
          - .flatpak-builder
          - build-dir
      - cargo-sources.json

# Build dependencies are now own manifest modules above (the §5.8 decision,
# 2026-09-06): the minimal ffmpeg module (ffmpeg + ffprobe + the libs libmpv
# and rsgain link), libmpv itself (the playback host meson gates configure
# on), flac, and rsgain (with libebur128, taglib, inih). The ffmpeg-full
# extension was struck: libs-only contract, optional by default, and
# discontinued at the freedesktop 25.08 base this GNOME 50 runtime sits on.
#
# Still owed, tracked rather than hidden:
#
# 1. The end-to-end sandboxed build + install + run pass is the Phase 20
#    gate and stays with Brandon (roadmap.md Phase 20, the Flatpak box).
# 2. The icon is still the placeholder glasshouse from logo.svg, and the
#    metainfo screenshots stay commented out until the real mark lands.

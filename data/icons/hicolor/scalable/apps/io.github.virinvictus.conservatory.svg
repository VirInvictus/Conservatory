<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Conservatory — the final mark (adopted 2026-10-07, the Phase 20 icon pass).
  The Victorian glasshouse silhouette, re-paletted from the libadwaita-blue
  placeholder to the Dragon accent per spec §15: the structure in the Dragon
  cream on an ink tile, its interior glow in the dragon yellow (the metainfo
  primary), the entrance in dragon blue, the finial ball in yellow. No
  waveforms, headphones, or play triangles; the architecture does the work.
  Keep identical to logo.svg at the repo root.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Conservatory">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a26"/>
      <stop offset="1" stop-color="#16151a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#c4b28a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c4b28a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hall">
      <path d="M 58 196 L 58 140 Q 79 122 100 128 L 100 116
               C 100 68 156 68 156 116 L 156 128 Q 177 122 198 140 L 198 196 Z"/>
    </clipPath>
  </defs>

  <!-- App tile: dragon ink -->
  <rect x="24" y="24" width="208" height="208" rx="32" fill="url(#tile)"/>

  <!-- Plinth -->
  <rect x="52" y="194" width="152" height="8" rx="3" fill="#c5c9c5"/>

  <!-- Glasshouse silhouette -->
  <path d="M 58 196 L 58 140 Q 79 122 100 128 L 100 116
           C 100 68 156 68 156 116 L 156 128 Q 177 122 198 140 L 198 196 Z"
        fill="#c5c9c5"/>

  <!-- Warm interior glow, clipped to the hall -->
  <rect x="52" y="64" width="152" height="140" fill="url(#glow)" clip-path="url(#hall)"/>

  <!-- Glazing bars + dome ribs, clipped to the hall -->
  <g clip-path="url(#hall)" stroke="#16151a" stroke-width="2.2" stroke-linecap="round" opacity="0.4">
    <line x1="72"  y1="190" x2="72"  y2="132"/>
    <line x1="86"  y1="190" x2="86"  y2="130"/>
    <line x1="110" y1="190" x2="110" y2="118"/>
    <line x1="146" y1="190" x2="146" y2="118"/>
    <line x1="170" y1="190" x2="170" y2="130"/>
    <line x1="184" y1="190" x2="184" y2="132"/>
    <line x1="60" y1="172" x2="196" y2="172"/>
    <line x1="128" y1="86" x2="104" y2="116"/>
    <line x1="128" y1="86" x2="118" y2="117"/>
    <line x1="128" y1="86" x2="140" y2="117"/>
    <line x1="128" y1="86" x2="152" y2="116"/>
  </g>

  <!-- Arched entrance: dragon blue -->
  <path d="M 118 196 L 118 176 Q 118 166 128 166 Q 138 166 138 176 L 138 196 Z"
        fill="#8ba4b0"/>

  <!-- Finial -->
  <line x1="128" y1="80" x2="128" y2="62" stroke="#c5c9c5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="128" cy="57" r="4" fill="#c4b28a"/>
</svg>

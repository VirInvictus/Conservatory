name: CI

on:
  push:
    branches: [main]
  pull_request:

# Defense in depth: the repo default is already read-only, but each
# workflow declares its own floor.
permissions:
  contents: read

# Stage-close pushes queue redundant runs; supersede in favour of the
# newest commit on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo ${{ matrix.action }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The GUI binary (Phase 3b) needs GTK4 (plain GTK4 only since Phase 26);
      # the core playback host (Phase 4a) links the system libmpv; rusqlite
      # stays `bundled` but the meson packaging validators (below) check the
      # declared sqlite3 dependency. meson / appstream / desktop-file-utils
      # run the packaging validators: a metainfo or desktop entry that stops
      # validating fails here, not at a Flathub submission (the meson tests
      # are wired in meson.build; CI is where they actually run).
      - name: Install system libraries and packaging validators
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libmpv-dev libsqlite3-dev appstream desktop-file-utils ninja-build
      # The apt meson on the runner (1.3.x) predates meson.build's >= 1.4.0
      # floor; pipx carries the current one.
      - name: Install meson (pipx; the apt package is older than the 1.4 floor)
        run: pipx install meson
      # rsgain (Phase 5c) is best-effort: the ReplayGain scan test skips when it
      # is absent, so a missing package never fails CI.
      - name: Install rsgain (best-effort)
        run: sudo apt-get install -y rsgain || true
      # ffmpeg/ffprobe (Phase 7a-ii): the embedded-M4B-chapter read shells
      # ffprobe. Best-effort like rsgain; the chapter test skips when absent.
      - name: Install ffmpeg (best-effort)
        run: sudo apt-get install -y ffmpeg || true

      # VERSION is the single source of truth (meson reads the file directly)
      # and the workspace Cargo.toml must match it; a missed sync corrupts the
      # AppStream version stamp. (Mirrors Atrium's guard.)
      - name: VERSION sync guard
        if: matrix.action == 'fmt'
        run: |
          CARGO_VERSION="$(grep -m1 '^version =' Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')"
          FILE_VERSION="$(cat VERSION)"
          if [ -z "$FILE_VERSION" ]; then
            echo "VERSION is empty; it is the single source of truth and meson reads it directly" >&2
            exit 1
          fi
          if [ "$FILE_VERSION" != "$CARGO_VERSION" ]; then
            echo "VERSION ($FILE_VERSION) != workspace Cargo.toml version ($CARGO_VERSION)" >&2
            exit 1
          fi

      # The Flatpak offline build vendors crates from the generated manifest;
      # a lock change without the regen leaves it pinning stale commits (bit
      # at v0.4.5 and again at v0.6.0 with the consumer waves). Fail CI
      # whenever the checked-in file disagrees with Cargo.lock (the Atrium
      # guard). `uv run` reads the script's PEP 723 header and provisions
      # aiohttp / PyYAML / tomlkit.
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # No uv.lock or requirements files here (the guard's deps ride the
          # PEP 723 inline header), so cache would be a dead glob.
          enable-cache: false

      - name: cargo-sources.json freshness guard
        if: matrix.action == 'fmt'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv run scripts/flatpak-cargo-generator.py Cargo.lock -o data/cargo-sources.json
          git diff --exit-code data/cargo-sources.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --all --check
        if: matrix.action == 'fmt'
        run: cargo fmt --all --check

      - name: meson packaging validators (appstreamcli + desktop-file-validate)
        if: matrix.action == 'fmt'
        run: |
          meson setup build-validate
          meson test -C build-validate

      - name: cargo clippy --workspace --all-targets -- -D warnings
        if: matrix.action == 'clippy'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        if: matrix.action == 'test'
        run: cargo test --workspace

  # The music-only build (spec §2.2): both binaries with the podcasts and
  # audiobooks plugin features off. Kept green from day one so the feature
  # gating can't rot between now and Phases 6/7.
  music-only:
    name: music-only (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # core (and thus the music-only binaries) links the system libmpv at
      # Phase 4a, so this job needs it too.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libmpv-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo clippy (music-only)
        run: cargo clippy -p conservatory-cli -p conservatory --no-default-features --all-targets -- -D warnings

      - name: cargo test (music-only)
        run: cargo test -p conservatory-cli -p conservatory --no-default-features

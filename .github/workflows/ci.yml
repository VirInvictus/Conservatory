name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: cargo ${{ matrix.action }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v5

      # The GUI binary (Phase 3b) needs GTK4 (plain GTK4 only since Phase 26);
      # the core playback host (Phase 4a) links the system libmpv; rusqlite
      # stays `bundled`.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libmpv-dev
      # rsgain (Phase 5c) is best-effort: the ReplayGain scan test skips when it
      # is absent, so a missing package never fails CI.
      - name: Install rsgain (best-effort)
        run: sudo apt-get install -y rsgain || true
      # ffmpeg/ffprobe (Phase 7a-ii): the embedded-M4B-chapter read shells
      # ffprobe. Best-effort like rsgain; the chapter test skips when absent.
      - name: Install ffmpeg (best-effort)
        run: sudo apt-get install -y ffmpeg || true

      # The Flatpak offline build vendors crates from the generated manifest;
      # a lock change without the regen leaves it pinning stale commits (bit
      # at v0.4.5 and again at v0.6.0 with the consumer waves). Fail CI
      # whenever the checked-in file disagrees with Cargo.lock (the Atrium
      # guard; container jobs run as root against a host-owned checkout, so
      # mark the workspace safe before touching git). `uv run` reads the
      # script's PEP 723 header and provisions aiohttp / PyYAML / tomlkit.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: cargo-sources.json freshness guard
        if: matrix.action == 'fmt'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv run scripts/flatpak-cargo-generator.py Cargo.lock -o data/cargo-sources.json
          git diff --exit-code data/cargo-sources.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all --check
        if: matrix.action == 'fmt'
        run: cargo fmt --all --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        if: matrix.action == 'clippy'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        if: matrix.action == 'test'
        run: cargo test --workspace

  # The music-only build (spec §2.2): both binaries with the podcasts and
  # audiobooks plugin features off. Kept green from day one so the feature
  # gating can't rot between now and Phases 6/7.
  music-only:
    name: music-only (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # core (and thus the music-only binaries) links the system libmpv at
      # Phase 4a, so this job needs it too.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libmpv-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy (music-only)
        run: cargo clippy -p conservatory-cli -p conservatory --no-default-features --all-targets -- -D warnings

      - name: cargo test (music-only)
        run: cargo test -p conservatory-cli -p conservatory --no-default-features

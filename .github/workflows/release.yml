name: Release

# A v* tag is always hand-cut (forward-only policy; the annotated message is
# that release's full patchnotes entry, verbatim, per the house tagging
# procedure). This workflow answers the tag with the same checks CI runs on
# main, then creates the GitHub Release from the tag's own message - unless
# one already exists (exists-checked: a hand-made Release is never
# duplicated; the v0.7.0 tag shipped with no Release at all, and this class
# dies here). Workflow shape mirrors Atrium's release.yml (CROSS-REPO GRANT
# #117), on this repo's ubuntu job.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-release:
    name: checks, then Release from the tag message
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libmpv-dev
      - name: Install rsgain (best-effort)
        run: sudo apt-get install -y rsgain || true
      - name: Install ffmpeg (best-effort)
        run: sudo apt-get install -y ffmpeg || true

      - name: VERSION / tag sync guard
        run: |
          CARGO_VERSION="$(grep -m1 '^version =' Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')"
          FILE_VERSION="$(cat VERSION)"
          if [ -z "$FILE_VERSION" ]; then
            echo "VERSION is empty; it is the single source of truth and meson reads it directly" >&2
            exit 1
          fi
          if [ "$FILE_VERSION" != "$CARGO_VERSION" ]; then
            echo "VERSION ($FILE_VERSION) != workspace Cargo.toml version ($CARGO_VERSION)" >&2
            exit 1
          fi
          if [ "v$FILE_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag ($GITHUB_REF_NAME) != VERSION ($FILE_VERSION)" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy (music-only)
        run: cargo clippy -p conservatory-cli -p conservatory --no-default-features --all-targets -- -D warnings

      - name: cargo test (music-only)
        run: cargo test -p conservatory-cli -p conservatory --no-default-features

      - name: Fetch the annotated tag object
        # actions/checkout rewrites refs/tags/vX to the resolved commit SHA
        # even on a full fetch, so the annotated object is gone locally and
        # `gh --notes-from-tag` silently falls back to the commit message
        # (issue #11: the fleet sweep found that failure mode across
        # Catagotchi, cquarry, saforums.koplugin, Colophon, Atrium, and
        # lattice-music; this repo's releases happened to match so far).
        # Force-restoring the ref after checkout is what makes the local
        # read below deterministic.
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
        env:
          TAG: ${{ github.ref_name }}

      - name: Create the Release from the tag's verbatim message
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The annotated tag object, read locally (the fetch above restores
          # it): one read serves both the body and the title, whose first
          # line IS the patchnotes heading. The objecttype guard is
          # heading-agnostic on purpose: a lightweight tag has no verbatim
          # entry to publish, so it errors loudly instead of guessing.
          OT="$(git for-each-ref "refs/tags/$TAG" --format='%(objecttype)')"
          if [ "$OT" != "tag" ]; then
            echo "::error::tag $TAG is $OT, not an annotated tag; the verbatim patchnotes entry is unavailable" >&2
            exit 1
          fi
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > /tmp/release-notes.md
          TITLE="$(head -1 /tmp/release-notes.md)"
          echo "Release title: $TITLE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; not duplicating"
          else
            gh release create "$TAG" \
              --notes-file /tmp/release-notes.md \
              --title "$TITLE" \
              --verify-tag
          fi
